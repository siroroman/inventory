name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typecheck, migration consistency, build and all tests. DB tests start PostgreSQL
  # through Testcontainers, which uses the Docker daemon of the runner.
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (static analysis)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrations are consistent
        run: pnpm --filter api db:check
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  # Known vulnerabilities in dependencies, dev tools included.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm audit --audit-level high

  # Keys and passwords committed anywhere in the history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint /bin/sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --verbose'

  # SAST: Semgrep's free registry rules for TypeScript, JavaScript and Node.js. Any finding fails the job.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.178.0 \
            semgrep scan --config p/typescript --config p/nodejs --config p/javascript --config p/security-audit \
              --error --metrics=off
